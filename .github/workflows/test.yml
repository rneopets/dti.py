name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    name: pytest ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        shell: bash
        run: |
          uv run --frozen pytest

  all-tests-pass:
    name: All tests pass
    runs-on: ubuntu-latest
    needs: [pytest]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.pytest.result }}" != "success" ]]; then
            exit 1
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install deps
        shell: bash
        run: |
          uv sync --frozen --only-dev

      - uses: pre-commit/action@v3.0.1
